model_name_or_path: /code/model_checkpoints/Qwen3-1.7B
# model_name_or_path: model_checkpoints/sft/rmt_sft_full_Qwen3-1.7B_WildChat-4.8M_v1/checkpoint-4500
learning_rate: 2.0e-5
eval_strategy: steps 
max_steps: 6000
eval_steps: 1500
save_steps: 1500
output_dir: ./model_checkpoints/ode_lm/ode_lm_full_Qwen3-1.7B_ultrachat_200k_v2
# eval_on_start: true

# DATASET PARAMS
dataset_text_field: text
test_split_size: 3000
dataset_num_proc: 22
remove_unused_columns: False
# в коде это реализовано другим способом, не средствами TRL
assistant_only_loss: False
dataset_name: HuggingFaceH4/ultrachat_200k
# dataset_name: zai-org/LongAlign-10k
# dataset_name: allenai/WildChat-4.8M


# MEMORY OPTIMIZATIONS
attn_implementation: flash_attention_2
dtype: bfloat16
use_liger_kernel: true
per_device_eval_batch_size: 16
per_device_train_batch_size: 4 
gradient_accumulation_steps: 4 
# gradient_checkpointing: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {"use_reentrant":True}
optim: adamw_8bit
# load_in_4bit: true
# load_in_8bit: true
packing: false
prediction_loss_only: true
warmup_steps: 30

# SPEED METRICS
include_num_input_tokens_seen: True
include_tokens_per_second: True
logging_steps: 4
